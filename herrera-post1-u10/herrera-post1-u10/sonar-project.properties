# sonar-project.properties — configuración del análisis de envios-service

# Identificación del proyecto en SonarQube/SonarCloud
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Código fuente y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Reporte de cobertura generado por JaCoCo (mvn clean verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Servidor: SonarQube local en Docker. Para SonarCloud: https://sonarcloud.io
# y agregar sonar.organization=<tu-organizacion>
sonar.host.url=http://localhost:9000

# No bloquear el comando esperando el Quality Gate
sonar.qualitygate.wait=false

# Exclusiones: ninguna. Todas las clases contienen lógica de negocio;
# no hay clase Main ni código generado que distorsione la cobertura.
# sonar.exclusions=
